<div class="snackbar-content-wrapper">
  <div class="snackbar-left">
    @if (!data.hideIcon) {
      <mat-icon class="snackbar-icon">{{ icon }}</mat-icon>
    }
    <span class="snackbar-message">{{ data.message }}</span>
  </div>
  <button
    mat-icon-button
    type="button"
    class="snackbar-close-btn"
    aria-label="Zamknij powiadomienie"
    (click)="close()"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>
